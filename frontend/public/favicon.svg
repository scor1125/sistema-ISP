<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EnlaceHR ISP">
  <title>EnlaceHR ISP</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121A2F"/>
      <stop offset="1" stop-color="#0A0E17"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1D06F"/>
      <stop offset="1" stop-color="#C59B27"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="12" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="11.25"
        fill="none" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- Big gold monogram "E" as brand mark -->
  <text x="32" y="34"
        text-anchor="middle" dominant-baseline="middle"
        font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="34" fill="url(#gold)" letter-spacing="-1">E</text>
  <!-- Full project name below, tiny but present -->
  <text x="32" y="53"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-weight="700"
        font-size="8" fill="#F8F9FA" letter-spacing="0.5">EnlaceHR</text>
  <!-- Small "ISP" tag under, in gold -->
  <text x="32" y="61"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500"
        font-size="4.5" fill="#D4AF37" letter-spacing="2">I S P</text>
</svg>

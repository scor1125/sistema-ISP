crons:
  - name: suspend-overdue
    description: "Suspende automáticamente los clientes cuya fecha de pago (next_due_date) ya venció, todos los días a las 09:00 UTC."
    cron: "0 9 * * *"
    endpoint: "{{BASE_URL}}/api/cron/suspend-overdue"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true

  - name: send-reminders
    description: "Envía por WhatsApp recordatorios personalizados a clientes cuyo pago vence en `days_before` días (config en /reminders/config). Corre cada día a las 15:00 UTC (mediodía America/Mexico)."
    cron: "0 15 * * *"
    endpoint: "{{BASE_URL}}/api/cron/send-reminders"
    method: POST
    enabled: true

  - name: tuya-scenes
    description: "Evalúa escenas Smart Life / Tuya cada 5 minutos y dispara comandos programados (ej: 'Todos apagados a las 11pm')."
    cron: "*/5 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/tuya-scenes"
    method: POST
    enabled: true
